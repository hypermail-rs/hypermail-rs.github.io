[package]
name = "hypermail-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"  # Required for floor_char_boundary() and modern str methods
description = "A Rust reimplementation of Hypermail - converts mbox files to cross-referenced HTML archives"
authors = [
    "Akis Karnouskos",
    "Tom Gruber",
    "Kevin Hughes <kevinh@kevcom.com>",
    "Kent Landfield <kent@landfield.com>",
    "Daniel Stenberg",
    "Peter McCluskey",
    "Jose Kahan",
    "Hypermail Project Contributors"
]
license = "GPL-2.0-or-later"
repository = "https://github.com/hypermail-rs/hypermail-rs.github.io"
homepage = "https://hypermail-rs.github.io"
documentation = "https://hypermail-rs.github.io/api-docs/hypermail/"
readme = "README.md"
keywords = ["email", "mbox", "html", "archive", "mime"]
categories = ["email", "command-line-utilities", "parser-implementations"]
exclude = [
    "files/",
    "fuzz/",
    "scripts/",
    "docs/",
    ".github/",
    "haof.xml",
]

# Library configuration - use "hypermail" for crate name to maintain compatibility
[lib]
name = "hypermail"
path = "src/lib.rs"

# Binary configuration - executable is named "hypermail" for drop-in replacement compatibility
[[bin]]
name = "hypermail"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Correctness lints (errors)
correctness = { level = "deny", priority = -1 }
# Style/complexity as warnings (advisory, not blocking CI)
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Pedantic: too noisy for CI enforcement, useful for local review
pedantic = { level = "allow", priority = -1 }
